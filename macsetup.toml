# ============================================================================
# macsetup.toml — Declarative macOS machine configuration
# ============================================================================
# One config to rule them all: packages, dotfiles, system defaults, and more.
# Run:  macsetup apply                      (uses ./macsetup.toml)
# Run:  macsetup apply -c ~/macsetup.toml   (uses custom config)
# ============================================================================

# ---------- Template inheritance --------------------------------------------
# Extend a base template — packages/defaults are merged, your config wins.
# Useful for layering personal prefs on top of a company or community preset.
#
# extends = [
#     "https://raw.githubusercontent.com/acme/macsetup/main/company.toml",
# ]

# ---------- Machine identity ------------------------------------------------
[machine]
computer_name = "my-air"
local_hostname = "my-air"                # Bonjour / .local hostname

# ---------- Homebrew packages -----------------------------------------------
[packages]
formulae = [
    "git",
    "neovim",
    "ripgrep",
    "fd",
    "fzf",
    "eza",
    "bat",
    "jq",
    "yq",
    "stow",
    "starship",
    "zoxide",
    "tmux",
    "lazygit",
    "gh",
    "curl",
    "wget",
    "tree",
    "htop",
]

casks = [
    "wezterm",
    "raycast",
    "1password",
    "arc",
    "visual-studio-code",
    "docker",
    "spotify",
]

# Homebrew taps beyond the default homebrew/core and homebrew/cask
taps = [
    # "homebrew/cask-fonts",
]

# ---------- Mac App Store (requires `mas` CLI) ------------------------------
[mas]
apps = [
    # { id = 497799835, name = "Xcode" },
    # { id = 1451685025, name = "WireGuard" },
]

# ---------- Dotfiles --------------------------------------------------------
[dotfiles]
repo   = "git@github.com:youruser/dotfiles.git"
dest   = "~/.dotfiles"              # Where to clone
method = "stow"                     # "stow" | "symlink" | "clone-only"

# GNU Stow packages to activate (subdirectories inside the dotfiles repo).
# Each one gets `stow -d <dest> -t ~ <package>`
stow_packages = [
    "zsh",
    "nvim",
    "git",
    "tmux",
    "starship",
    "wezterm",
]

# ---------- Default shell ---------------------------------------------------
[shell]
default = "/bin/zsh"                # Must exist in /etc/shells

# ---------- macOS system defaults -------------------------------------------
# Each [defaults.<domain>] section maps to `defaults write <domain> <key> <value>`.
# Supported value types: string, int, float, bool.

[defaults.NSGlobalDomain]
AppleShowAllExtensions          = true
NSAutomaticSpellingCorrectionEnabled = false
NSAutomaticCapitalizationEnabled     = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled  = false
NSAutomaticDashSubstitutionEnabled   = false
KeyRepeat                       = 2
InitialKeyRepeat                = 15
AppleInterfaceStyle             = "Dark"
NSDocumentSaveNewDocumentsToCloud = false
NSNavPanelExpandedStateForSaveMode  = true
NSNavPanelExpandedStateForSaveMode2 = true
PMPrintingExpandedStateForPrint     = true
PMPrintingExpandedStateForPrint2    = true
ApplePressAndHoldEnabled        = false  # Enable key repeat instead of accent menu

[defaults."com.apple.finder"]
ShowPathbar            = true
ShowStatusBar          = true
AppleShowAllFiles      = true
FXEnableExtensionChangeWarning = false
FXPreferredViewStyle   = "Nlsv"          # List view
_FXShowPosixPathInTitle = true
_FXSortFoldersFirst    = true
FXDefaultSearchScope   = "SCcf"          # Search current folder by default

[defaults."com.apple.dock"]
autohide           = true
autohide-delay     = 0.0
autohide-time-modifier = 0.4
tilesize           = 36
show-recents       = false
minimize-to-application = true
mru-spaces         = false               # Don't rearrange Spaces based on recent use
launchanim         = false

[defaults."com.apple.Safari"]
ShowFullURLInSmartSearchField = true
AutoOpenSafeDownloads         = false

[defaults."com.apple.screencapture"]
location = "~/Screenshots"
type     = "png"
disable-shadow = true

[defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores     = true

[defaults."com.apple.ActivityMonitor"]
ShowCategory = 0                        # Show All Processes

[defaults."com.apple.TextEdit"]
RichText = 0                            # Plain text mode by default

[defaults."com.apple.TimeMachine"]
DoNotOfferNewDisksForBackup = true

# ---------- System tweaks (require sudo) ------------------------------------
[system]
pam_tid            = true               # Enable Touch ID for sudo
reveal_library     = true               # Unhide ~/Library
screenshots_dir    = "~/Screenshots"    # Created if missing
expand_save_dialog = true               # Already handled by NSGlobalDomain above; kept for clarity

# ---------- Post-install hooks ----------------------------------------------
# Shell commands run at the very end. Use for anything not covered above.
[hooks]
post_install = [
    "softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true",
    "[ -d ~/Screenshots ] || mkdir -p ~/Screenshots",
]
