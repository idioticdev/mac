name: Bug Report
description: Something isn't working correctly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, please run `mac validate` and check [existing issues](https://github.com/idiotic/mac/issues).

  - type: input
    id: mac-version
    attributes:
      label: mac version
      description: Run `mac version` and paste the output.
      placeholder: "e.g. v0.4.1"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Found in System Settings → General → About.
      placeholder: "e.g. macOS 15.3 (Sequoia)"
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Architecture
      description: Apple Silicon (arm64) or Intel (amd64)?
      placeholder: "e.g. Apple Silicon (M3)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `mac apply -c ...`
        2. See error ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant mac.toml section
      description: Paste only the relevant section. Redact personal info (repo URLs, usernames, machine names).
      render: toml

  - type: textarea
    id: logs
    attributes:
      label: Full error output
      description: Run the command again and paste the complete output.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I ran `mac validate` and it passed (or this is the bug).
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I redacted sensitive information from the config snippet.
          required: true
